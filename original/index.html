<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width">
    <!-- <meta http-equiv="Content-Security-Policy"
          content="default-src * 'unsafe-eval' 'unsafe-inline'"> -->

    <!-- Local web copy: offline only. The original app pulled replacement content from
         atheos-app.com and synced to Firebase; both are dead, so all network access is blocked. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src https://www.youtube.com">

    <meta name="robots" content="noindex, nofollow">
    <title>Atheos (original app)</title>

    <link href="lib/ionic/css/ionic.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/animate.css" rel="stylesheet">

    <!-- IF using Sass (run gulp sass first), then uncomment below and remove the CSS includes above
    <link href="css/ionic.app.css" rel="stylesheet">
    -->

    <!-- ionic/angularjs js -->
    <script src="lib/ionic/js/ionic.bundle.js"></script>

    <!-- firebase -->
    <script src="lib/firebase/firebase.js"></script>
    <script src="lib/angularfire/dist/angularfire.js"></script>

    <!-- dynamic text area-->
    <script src="lib/angular-elastic/elastic.js"></script>

    <!-- AngularJS directive and filters for Moment.JS. -->
    <script src="lib/moment/moment.js"></script>
    <script src="lib/angular-moment/angular-moment.js"></script>


    <!-- cordova script  load only if running on mobile -->
    <!-- Does your index.html load the cordova.js script?
        (i.e. if you have www/index.html then you can just reference cordova.js.
        This file is not in the www directory,
        but automatically generated by Cordova and inserted in your app) -->
     <script type="text/javascript">
      ;(function () {
        var cordovaScripts = [
          "cordova.js"
        ] ;

        // Web copy: a browser has no Cordova bridge, so cordova.js is never loaded,
        // even on a phone (where the original check would load it and stall the app).
        if (false) {
          try {
            cordovaScripts.forEach(loadScript) ;
          } catch (err) {
            console.log(err.message) ;
          }
        }

        function loadScript(src) {
          var line = '<script type="text/javascript" charset="utf-8" src="' + src + '"><' +'/script>' ;
          document.writeln(line);
          console.log("loaded " + src);
        }

      })();
    </script>


    <!-- https://github.com/mozilla/localForage -->
    <script src="lib/localforage/dist/localforage.js"></script>
    <script src="lib/localforage-cordovasqlitedriver/dist/localforage-cordovasqlitedriver.js"></script>


    <!-- https://github.com/chjj/marked -->
    <script src="lib/marked.min.js"></script>
    <!-- ensure latest js language support -->
    <script src="lib/es6-shim.min.js"></script>
    <!-- see http://lunrjs.com/ -->
    <script src="lib/lunr.min.js"></script>

    <!-- your app's js -->


    <!-- load minified, obfuscated js -->
    <!-- We also need to load the templates file in the index.html -->
    <script src="js/build/lunr.js" type="text/javascript"></script>
    <script src="js/build/root_loader.js" type="text/javascript"></script>
    <script src="web-shim.js"></script>
    <script src="js/build/app.js"></script>
    <script src="js/build/templates.js"></script>
    <script src="js/build/controllers.js"></script>
    <script src="js/build/services.js"></script>


    <!-- ensure any free form urls are opened in the system browser -->
    <script>
        document.onclick = function (e) {
            e = e ||  window.event;
            var element = e.target || e.srcElement;

            if (element.tagName == 'A') {
                if(element.href.indexOf("#/app/") == -1  && element.href != '' ) {
                  // console.log("intercepting link: " + element.href ) ;
                  window.open(element.href, "_system", "location=yes");
                  return false; // prevent default action and stop event propagation
                }
            }
        };

        function quiz_change(el) {
            var scope = angular.element(document.getElementById("quiz")).scope();
            console.log("quiz_change");
            console.log(event);
            console.log(scope);
            scope.$apply(function(){
                console.log("apply");
                console.log(event);
                scope.uncheck(event);
            })
        }
    </script>




  </head>
  <body id="starter" animation="slide-left-right-ios7" ng-strict-di class="platform-android platform-cordova platform-webview">

    <!--
      The views will be rendered in the <ion-nav-view> directive below
      Templates are in the /templates folder (but you could also
      have templates inline in this html file if you'd like).
    -->
    <ion-nav-view ></ion-nav-view>
  </body>
</html>

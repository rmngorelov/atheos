


<ion-view  >




    <ion-nav-bar class="bar-stable nav-title-slide-ios7" >
        <ion-nav-back-button></ion-nav-back-button>

      <ion-nav-buttons side="right">
          <button class="button button-icon icon ion-search" ui-sref="app.search"  ></button>
          <button class="button button-icon icon ion-navicon" ng-click="toggleRight()"   ></button>
        </ion-nav-buttons>
    </ion-nav-bar>

  <ion-content class="category has-header "   overflow-scroll="true">

    <ion-item
    class="persona item-content item-text-wrap heading"
    style="border-top:0px;"
    >
      <div >Glossary</div>
    </ion-item>


      <div ng-repeat="definition in definitions"  >
        <ion-item class="persona item-content item-text-wrap item-icon-right"
                  ng-class="{active: definition.show}"
                  ng-click="definition.show = !definition.show"
                  >
          <div  >
            <span  style="padding-left:0px;" class="definition-description item-content item-text-wrap" >{{definition.term | limitTo: 80 }}
            </span>
          </div>
          <i class="icon"  ng-class="definition.show ? 'ion-chevron-up' : 'ion-chevron-down'" ></i>

        </ion-item>
        <ion-item class="glossary-full-description  item-accordion"
          ng-show="definition.show">
            <div class="answer item-content item-text-wrap" >{{definition.description}}</div>
        </ion-item>

      </div>


  </ion-content>
</ion-view>

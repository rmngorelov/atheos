<ion-view  >




    <ion-nav-bar class="bar-stable nav-title-slide-ios7" >
      <ion-nav-back-button></ion-nav-back-button>

     <ion-nav-buttons side="right">
        <button class="button button-icon icon ion-search" ui-sref="app.search"  ></button>
        <button class="button button-icon icon ion-navicon" ng-click="toggleRight()"   ></button>
      </ion-nav-buttons>

    </ion-nav-bar>

  <ion-content class="category has-header ">



      <ion-item
      class="perna item-content item-text-wrap item-icon-right heading"
      style="border-top:0px;"
      >
        <div>Credits</div>
      </ion-item>

        <ion-item class="persona"
                  >
          <img  ng-if="person.image"  class="image-small"   src="{{person.image}}" />
          <img  ng-if="!person.image" class="image-small"   src="img/person.png" />
          <span class="item-text-wrap">{{person.name}}</span>
          <div style="float:left;margin-top:8px;padding:4px;" class="answer item-text-wrap" >{{person.description}}</div>
        </ion-item>


  </ion-content>
</ion-view>
